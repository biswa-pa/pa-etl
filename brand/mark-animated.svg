<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- PA ETL mark with a data dot flowing through the transform step. Used as the loader. -->
  <defs>
    <linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a52"/><stop offset="1" stop-color="#1a0a22"/></linearGradient>
    <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb23d"/><stop offset="1" stop-color="#fd9904"/></linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#af)" stroke="url(#ao)" stroke-width="3.2">
    <animate attributeName="stroke-opacity" values="1;.55;1" keyTimes="0;.5;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <circle cx="16.5" cy="32" r="4.6" fill="url(#ao)"/>
  <path d="M21.5 32h4" fill="none" stroke="url(#ao)" stroke-width="3.2" stroke-linecap="round" opacity=".55"/>
  <rect x="27.5" y="26.5" width="11" height="11" rx="2.6" transform="rotate(45 33 32)" fill="none" stroke="url(#ao)" stroke-width="3.2" stroke-linejoin="round">
    <animate attributeName="stroke-opacity" values=".45;1;.45" keyTimes="0;.5;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <path d="M42 32h8.5M46.5 27.2l4.8 4.8-4.8 4.8" fill="none" stroke="url(#ao)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="stroke-opacity" values=".45;1;.45" keyTimes="0;.85;1" dur="1.8s" repeatCount="indefinite"/>
  </path>
  <!-- the data dot: leaves the source, passes the diamond, reaches the arrow -->
  <circle r="3.4" fill="#fff3d6">
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M16.5 32H50" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.82;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
