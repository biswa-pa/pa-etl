# Builds the PA ETL images and publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/pa-etl/prefect   Prefect server and worker with the pa_etl helpers
#   ghcr.io/<owner>/pa-etl/gateway   portal, host routing and branding for Prefect and Airbyte
# Pushes to main publish :latest and :sha-<short>. A tag like v1.2.0 publishes :1.2.0 too.
name: publish-images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: prefect, file: prefect/Dockerfile }
          - { name: gateway, file: gateway/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - name: Read versions
        id: v
        run: |
          echo "prefect_tag=$(grep -E '^PREFECT_TAG=' .env.example | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.v.outputs.owner }}/pa-etl/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PREFECT_TAG=${{ steps.v.outputs.prefect_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
